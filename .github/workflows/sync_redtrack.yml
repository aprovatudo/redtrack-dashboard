name: Sync Redtrack Channels

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Sync novas contas do Redtrack
        env:
          REDTRACK_API_KEY: ${{ secrets.REDTRACK_API_KEY }}
        run: python sync_redtrack.py
